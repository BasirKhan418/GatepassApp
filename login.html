<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatepass Login</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Raleway, sans-serif;
        }
        body{
            background: linear-gradient(90deg, #73479a, #1804af);
        }
        .main{
            display: flex;
            padding-top: 10vh;
            align-items: center;
            justify-content: center;
        }
        .main_container{
            height: 80vh;
            width: 70%;
            border-radius: 50px;
            display: flex;

        }
        .container_1{
            background-color: #56f307;
            height: 100%;
            width: 60%;
            border-top-left-radius: 50px;
            border-bottom-left-radius: 50px;

        }
        .container_1 img{
            height: 100%;
            width: 100%;
            border-top-left-radius: 50px;
            border-bottom-left-radius: 50px;

        }
        .container_2{
            background-color: #fff;
            height: 100%;
            width: 40%;
            border-top-right-radius: 50px;
            border-bottom-right-radius: 50px;
        }
        .welcome{
            background: linear-gradient(90deg, #73479a, #1804af);
            height: 8vh;
            width: 65%;
            border-top-right-radius: 50px;
            border-bottom-right-radius: 50px;
            margin-top: 15px;
        }
        .welcome p{
            color: #fff;
            font-size: 1.5rem;
            word-spacing: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .login{
            /* background-color: #31d72c; */
            height: 10vh;
            width: 70%;
            margin-top: 50px;
            margin-left: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login p{
            font-size: 1.3rem;
            color: #73479a;
        }
        .input{
            height: 25vh;
            width: 80%;
            margin: 50px;
            
        }
        .input input{
            border: none;
            border-bottom: 2px solid #d1d1d4;
            background: none;
            padding: 10px;
            padding-left: 24px;
            font-weight: 700;
            width: 75%;
            transition: 0.2s;
            /* padding: 10px; */
        }
        .button{
            height: 10vh;
            width: 100%;
            border-radius: 40px;
        }
        .button button{
           background: linear-gradient(90deg, #73479a, #1804af);
           height: 7vh;
           width: 40%;
           color: #ffffff;
           font-size: 1.8rem;
           border-right: 40px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="main_container">
            <div class="container_1">
                <img src="Screenshot 2024-03-19 152820.png" alt="">
            </div>
            <div class="container_2">
                <div class="welcome">
                    <p>Welcom back</p>
                </div>
                <div class="login">
                    <p>Login your account</p>
                </div>
                <div class="input">
                    <input 
                    type="text"
                    class="login__input"
                    placeholder="User name / Email"
                  />
                  <input 
                    type="password"
                    class="login__input"
                    placeholder="Password"
                  />
                </div>
                <div class="button">
                    <button>Login</button>
                </div>
                <div class="create_account"></div>
                <div class="forgot"></div>
            </div>
        </div>
    </div>
</body>
</html>
